name: ci
on:
  push: { branches: [main, master] }
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install Python
        run: uv python install ${{ matrix.python-version }}
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pyright
      - name: Import + validate example config
        run: |
          uv run --with pyyaml --with playwright --with markdown python -c "import repocast, repocast.engine, repocast.tts, repocast.config"
          uv run --with pyyaml python -m repocast validate --template examples/walkthrough.yaml
      - name: Tests
        run: uv run --with pytest --with pyyaml --with playwright --with markdown pytest -q
