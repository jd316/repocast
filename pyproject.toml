[project]
name = "repocast"
version = "0.2.1"
description = "General-purpose, agent-operated demo video maker for products, software workflows, code, docs, and media."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Joydip Biswas" }]
keywords = ["agent", "demo", "walkthrough", "video", "tts", "playwright", "documentation", "onboarding"]
dependencies = [
    "pyyaml>=6",
    "playwright>=1.40",
    "markdown>=3.5",
]

[project.urls]
Homepage = "https://github.com/jd316/repocast"
Issues = "https://github.com/jd316/repocast/issues"

[dependency-groups]
dev = ["jsonschema>=4", "playwright>=1.40", "pyright>=1.1", "pytest>=8", "ruff>=0.6"]

[project.scripts]
repocast = "repocast.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["repocast"]

[tool.ruff]
line-length = 100

[tool.pyright]
include = ["repocast", "tests"]
pythonVersion = "3.10"
