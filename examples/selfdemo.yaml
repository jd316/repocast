# repocast's own walkthrough — generated BY repocast, for the README (dogfood).
# Render: repocast render examples/selfdemo.yaml
output: selfdemo.mp4
size: youtube
captions: true
burn_captions: true
theme: {background: "#111827", padding: 36, radius: 16, shadow: true}
quality: {loudness_target: -16, loudness_tolerance: 2}

tts:
  provider: gemini
  voice: Charon
  model: gemini-3.1-flash-tts-preview
  style: "Read this aloud in a clear, natural voice, professional and measured, like a developer showing their own tool. Do not add any words: "

segments:
  - doc:
      name: What repocast is
      file: ../README.md
      steps:
        - {anchor: repocast, intro: "This is Repocast — and this walkthrough was generated by Repocast itself.", say: "A coding agent describes the story, then Repocast turns real documentation, commands, browser actions, and media into a reproducible demo."}
        - {anchor: timing-model, say: "The key design choice is audio-first. Narration is measured before recording, so the video follows the speech without cumulative drift."}
        - {anchor: configuration, say: "A small YAML file combines documentation, terminal, browser, and imported media scenes with themes, captions, focus effects, and annotations."}
        - {anchor: cli, say: "A handful of commands: init to scaffold, render to build, plus validate, voices, and verify."}

  - terminal:
      name: Using it
      cwd: ..
      title: "repocast — the CLI"
      steps:
        - {run: ["repocast", "--help"], say: "The command line interface exposes validation, dry runs, rendering, verification, voices, and its schema."}
        - {run: ["repocast", "init", "/tmp/demo.yaml", "--force"], say: "init scaffolds a walkthrough config you then edit."}
        - {run: ["repocast", "validate", "--template", "/tmp/demo.yaml"], say: "validate checks it before you spend time rendering. That's repocast — pointed at itself."}
