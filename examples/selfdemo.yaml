# repocast's own walkthrough — generated BY repocast, for the README (dogfood).
# Render: repocast render examples/selfdemo.yaml
output: selfdemo.mp4
size: [1920, 1080]

tts:
  provider: gemini
  voice: Charon
  model: gemini-3.1-flash-tts-preview
  style: "Read this aloud in a clear, natural voice, professional and measured, like a developer showing their own tool. Do not add any words: "

segments:
  - doc:
      name: What repocast is
      file: ../README.md
      steps:
        - {anchor: repocast, intro: "This is repocast — and this walkthrough was generated by repocast itself.", say: "It turns a code project into a narrated walkthrough video: the design doc, the real terminal output, and the live app — no screen recording."}
        - {anchor: how-it-stays-in-sync-the-design-choice-that-matters, say: "The key design choice is audio-first. The narration is synthesised and measured before recording, so the video is paced to the speech and never drifts."}
        - {anchor: the-config, say: "You describe the walkthrough in a small YAML file — three optional segments: a doc to scroll, terminal commands to run, and an app to drive in a browser."}
        - {anchor: cli, say: "A handful of commands: init to scaffold, render to build, plus validate, voices, and verify."}

  - terminal:
      name: Using it
      cwd: ..
      title: "repocast — the CLI"
      steps:
        - {run: ["repocast", "--help"], say: "The command line interface — five subcommands."}
        - {run: ["repocast", "init", "/tmp/demo.yaml", "--force"], say: "init scaffolds a walkthrough config you then edit."}
        - {run: ["repocast", "validate", "--template", "/tmp/demo.yaml"], say: "validate checks it before you spend time rendering. That's repocast — pointed at itself."}
