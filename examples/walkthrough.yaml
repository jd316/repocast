# repocast walkthrough config — a narrated video of your project.
# All file/cwd paths are relative to THIS file's directory.
# Render:  repocast render examples/walkthrough.yaml
# Validate: repocast validate examples/walkthrough.yaml

output: walkthrough.mp4          # .mp4 or .gif, written next to this config
size: youtube                    # youtube | portrait | square | [width, height]
captions: true                   # writes walkthrough.srt; may also be a .srt/.vtt path
burn_captions: true              # makes captions visible in the exported video

theme:
  background: "#111827"
  padding: 36
  radius: 16
  shadow: true

video: {crf: 21, fps: 30, preset: slow}
quality: {loudness_target: -16, loudness_tolerance: 2}

tts:
  provider: gemini               # gemini | none  (none = silent video, use your own voice)
  voice: Charon                  # Charon | Orus | Iapetus | Algenib  (run `repocast voices` to pick)
  model: gemini-3.1-flash-tts-preview   # keep this — the 2.5 TTS models silently drop some lines
  style: "Read this aloud in a clear, natural voice, professional and measured. Do not add any words: "

segments:
  # 1) Walk the design doc, section by section. Anchors are the rendered markdown
  #    heading IDs (lowercase, spaces->hyphens). `repocast render` errors loudly
  #    on a wrong anchor instead of silently skipping it.
  - doc:
      name: Design document
      file: ../path/to/your/project/DESIGN.md
      steps:
        - {anchor: architecture,   intro: "Let's start with the design.", say: "The system is layered: HTTP, a service layer, and a storage layer."}
        - {anchor: the-atomic-gate, say: "The core is a single atomic update — check and deduct in one statement, so concurrency can't oversell."}

  # 2) Run real commands and film their real output (rendered as a terminal — no
  #    terminal emulator needed). `say` is spoken while the command's output holds.
  - terminal:
      name: Tests & demo
      cwd: ../path/to/your/project
      title: "myproject — make"
      steps:
        - {run: ["make", "test"], say: "The full test suite — green, with coverage."}
        - {run: ["make", "demo"], env: {CI: "1"}, say: "A scripted end-to-end walkthrough."}

  # 3) Drive the live app in a real browser. `start` launches it; actions are a
  #    small DSL: say / click / fill(+value) / wait_for(+timeout) / press / eval /
  #    goto / sleep. `zoom` fills a 1080p frame with a centred web app.
  - app:
      name: Live app
      cwd: ../path/to/your/project
      start: ["make", "run"]
      env: {}
      url: "http://127.0.0.1:8000"
      ready_path: /health
      zoom: 1.4
      actions:
        - {say: "And here it is running for real."}
        - {click: '#some-button', focus: true, effect: ripple}
        - {fill: '#some-input', value: "hello", focus: true}
        - {say: "Submitting a request…"}
        - {click: '#submit'}
        - {wait_for: '.result', timeout: 60000}
        - annotate: {target: '.result', text: "Live result"}
        - {say: "…and the result comes back."}

  # 4) Images, animated GIFs, and existing video can join the same narrated output.
  # - media:
  #     file: architecture.png
  #     duration: 5
  #     fade: 0.25
  #     say: "The same demo can include generated diagrams and existing footage."
